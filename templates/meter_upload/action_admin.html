<form action="?" method="post" name="frmMeterUpload" class="form-horizontal">
<div class="form-group">
 <label class="control-label"><#LANG_MU_PROVIDER#></label>
 <div class="controls"><select name="provider" class="form-control">
  <option value="custom"[#if PROVIDER="custom"#] selected[#endif#]>Custom</option>
  <option value="tesk"[#if PROVIDER="tesk"#] selected[#endif#]>ТЭСК</option>
  <option value="tosk"[#if PROVIDER="tosk"#] selected[#endif#]>ТОСК</option>
  <option value="saures"[#if PROVIDER="saures"#] selected[#endif#]>Saures</option>
  <option value="mygas"[#if PROVIDER="mygas"#] selected[#endif#]>Мой газ</option>
  <option value="kyivenergo"[#if PROVIDER="kyivenergo"#] selected[#endif#]>Київенерго (UA)</option>
  <option value="kyivgaz"[#if PROVIDER="kyivgaz"#] selected[#endif#]>Київгаз (UA)</option>
  <option value="ukrgaz"[#if PROVIDER="ukrgaz"#] selected[#endif#]>Укргаз (UA)</option>
  <option value="lvivgaz"[#if PROVIDER="lvivgaz"#] selected[#endif#]>Львівгаз (UA)</option>
 </select></div>
</div>
<div class="form-group">
 <label class="control-label"><#LANG_MU_ENDPOINT#></label>
 <div class="controls"><input type="text" name="endpoint" value="[#ENDPOINT#]" class="form-control" placeholder="https://..."></div>
</div>
<div class="form-group">
 <label class="control-label"><#LANG_MU_ENTITY#></label>
 <div class="controls"><select name="entity_type" id="mu_entity" class="form-control" onchange="muToggleEntity();">
  <option value="individual"[#if ENTITY_TYPE="individual"#] selected[#endif#]><#LANG_MU_INDIVIDUAL#></option>
  <option value="legal"[#if ENTITY_TYPE="legal"#] selected[#endif#]><#LANG_MU_LEGAL#></option>
 </select></div>
</div>
<div id="mu_legal_fields" [#if ENTITY_TYPE!="legal"#]style="display:none"[#endif#]>
 <div class="form-group">
  <label class="control-label"><#LANG_MU_COMPANY#></label>
  <div class="controls"><input type="text" name="company_name" value="[#COMPANY_NAME#]" class="form-control"></div>
 </div>
 <div class="form-group">
  <label class="control-label"><#LANG_MU_EDRPOU#></label>
  <div class="controls"><input type="text" name="edrpou" value="[#EDRPOU#]" class="form-control" placeholder="12345678"></div>
 </div>
 <div class="form-group">
  <label class="control-label"><#LANG_MU_IBAN#></label>
  <div class="controls"><input type="text" name="iban" value="[#IBAN#]" class="form-control" placeholder="UA..."></div>
 </div>
</div>
<div class="form-group">
 <label class="control-label"><#LANG_MU_ACCOUNT#></label>
 <div class="controls"><input type="text" name="account" value="[#ACCOUNT#]" class="form-control"></div>
</div>
<div class="form-group">
 <label class="control-label"><#LANG_MU_UNIT#></label>
 <div class="controls"><select name="unit" class="form-control">
  <option value="kWh"[#if UNIT="kWh"#] selected[#endif#]>кВт·год (kWh)</option>
  <option value="m3"[#if UNIT="m3"#] selected[#endif#]>м³ (m3)</option>
  <option value="Gcal"[#if UNIT="Gcal"#] selected[#endif#]>Гкал (Gcal)</option>
 </select></div>
</div>
<div class="form-group">
 <label class="control-label"><#LANG_MU_TOKEN#></label>
 <div class="controls"><input type="password" name="token" value="" class="form-control" placeholder="[#TOKEN_MASK#]" autocomplete="new-password"></div>
</div>
<div class="form-group">
 <label class="control-label"><#LANG_MU_METERS#></label>
 <div class="controls"><textarea name="meters" rows="6" class="form-control">[#METERS#]</textarea></div>
</div>
<div class="form-group">
 <div class="controls"><label><input type="checkbox" name="enabled" value="1"[#if ENABLED="1"#] checked[#endif#]> <#LANG_MU_ENABLED#></label></div>
</div>
<div class="form-actions">
 <button type="submit" name="subm" class="btn btn-primary"><#LANG_UPDATE#></button>
 <button type="button" onclick="return muTest();" class="btn btn-default"><#LANG_MU_TEST#></button>
 <button type="button" onclick="return muSync();" class="btn btn-default"><#LANG_MU_SYNC#> ([#QUEUE_COUNT#])</button>
 <input type="hidden" name="mode" value="update">
</div>
</form>
<p class="help-block"><#LANG_MU_HINT#></p>
<script>
function muToggleEntity() {
 var legal = document.getElementById('mu_entity').value === 'legal';
 var box = document.getElementById('mu_legal_fields');
 if (box) box.style.display = legal ? '' : 'none';
}
function muTest() {
 var data = new FormData();
 data.append('values', '{}');
 fetch('/modules/meter_upload/ajax.php', {method:'POST', body:data, credentials:'same-origin'})
 .then(function(r){return r.json();})
 .then(function(res){alert(res.status + ': ' + res.msg);})
 .catch(function(){alert('<#LANG_MU_ERROR#>');});
 return false;
}
function muSync() {
 var data = new FormData();
 data.append('op', 'sync');
 fetch('/modules/meter_upload/ajax.php', {method:'POST', body:data, credentials:'same-origin'})
 .then(function(r){return r.json();})
 .then(function(res){alert(res.msg + ' / ' + res.remaining); location.reload();})
 .catch(function(){alert('<#LANG_MU_ERROR#>');});
 return false;
}
</script>
